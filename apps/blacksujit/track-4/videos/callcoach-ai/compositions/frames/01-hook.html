    <script>
      const W=1920,H=1080,TOTAL_DUR=6;
      const TIMING={shatterAt:1.5,glassesAt:1.5,morphAt:3.0,taglineAt:4.5};

      const playBtn=document.getElementById('playBtn');
      const pieces=[];
      for(let i=0;i<16;i++){
        const p=document.createElement('div');
        p.className='piece';
        p.style.width='18px';p.style.height='18px';
        p.style.backgroundColor='#00C2CB';
        p.style.left='50%';p.style.top='35%';
        playBtn.appendChild(p);
        pieces.push(p);
      }

      gsap.set('#tri',{opacity:1});
      gsap.set(pieces,{opacity:0});
      gsap.set('#glasses',{opacity:0,scale:0});
      gsap.set('#report',{opacity:0,scale:0.85});
      gsap.set('#wordmark',{opacity:0,scale:0});
      gsap.set('#tagline',{opacity:0,y:20});

      window.__timelines=window.__timelines||{};
      const tl=gsap.timeline({paused:true});
      window.__timelines["01-hook"]=tl;

      tl.fromTo('#tri',{opacity:0,scale:0.5},{opacity:1,scale:1,duration:0.5,ease:'power3.out'},0.5);

      pieces.forEach((p,i)=>{
        const angle=(i/pieces.length)*Math.PI*2;
        const distance=300;
        tl.to(p,{x:Math.cos(angle)*distance,y:Math.sin(angle)*distance,opacity:1,scale:0.8,duration:0.8,ease:'power3.out'},TIMING.shatterAt);
      });

      tl.set('#glasses',{opacity:1},TIMING.glassesAt+0.3);
      tl.fromTo('#glasses',{opacity:0,scale:0},{opacity:1,scale:1,duration:0.8,ease:'power3.out'},TIMING.glassesAt);

      tl.to(['#glasses','#report'],{opacity:0,scale:0.8,duration:0.3,ease:'power3.in'},TIMING.morphAt);
      tl.fromTo('#wordmark',{opacity:0,scale:0,y:20},{opacity:1,scale:1,y:0,duration:0.8,ease:'power3.out'},TIMING.morphAt+0.1);
      tl.to(['#bar1','#bar2','#bar3','#bar4'],{width:function(i){return ['75%','60%','55%','40%'][i];},duration:0.6,ease:'power3.out',stagger:0.15},'<+0.2');
