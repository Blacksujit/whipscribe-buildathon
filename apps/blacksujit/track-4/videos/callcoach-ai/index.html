<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="54"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-02-problem"
        class="scene"
        data-composition-id="02-problem"
        data-composition-src="compositions/frames/02-problem.html"
        data-start="6"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-03-solution"
        class="scene"
        data-composition-id="03-solution"
        data-composition-src="compositions/frames/03-solution.html"
        data-start="14"
        data-duration="10"
        data-track-index="1"
      ></div>

      <div
        id="el-04-evidence"
        class="scene"
        data-composition-id="04-evidence"
        data-composition-src="compositions/frames/04-evidence.html"
        data-start="24"
        data-duration="10"
        data-track-index="1"
      ></div>

      <div
        id="el-05-trend"
        class="scene"
        data-composition-id="05-trend"
        data-composition-src="compositions/frames/05-trend.html"
        data-start="34"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-06-results"
        class="scene"
        data-composition-id="06-results"
        data-composition-src="compositions/frames/06-results.html"
        data-start="42"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-07-cta"
        class="scene"
        data-composition-id="07-cta"
        data-composition-src="compositions/frames/07-cta.html"
        data-start="48"
        data-duration="6"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
