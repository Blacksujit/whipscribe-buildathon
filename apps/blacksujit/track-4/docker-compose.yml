version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "5000:5000"
    environment:
      - WHIPSKRIBE_API_KEY=${WHIPSKRIBE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,https://callcoach-ai-dashboard.vercel.app
      - FRONTEND_URL=http://localhost:3000
      - FLASK_SECRET_KEY=dev-secret-key-change-in-prod
      - UPLOAD_POLL_TIMEOUT=900
      - UPLOAD_URL_POLL_TIMEOUT=1800
      - DB_PATH=/app/data/callcoach.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5000
      - NEXT_PUBLIC_DEBUG=false
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped