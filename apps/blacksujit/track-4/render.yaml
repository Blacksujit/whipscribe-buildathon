# Force redeploy - timeout fix
services:
  - type: web
    name: callcoach-backend
    region: oregon
    env: docker
    dockerfilePath: backend.Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheck:
      path: /api/health
      intervalSeconds: 300
    envVars:
      # WhipScribe API key. WHIPSCRIBE_API_KEY is the correct spelling;
      # WHIPSKRIBE_API_KEY is the legacy name kept as a fallback for existing
      # deploys. Set one of them in the Render dashboard.
      - key: WHIPSCRIBE_API_KEY
        sync: false
      - key: WHIPSKRIBE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: "https://callcoachai.sujit.top,https://callcoach-ai-dashboard.vercel.app,https://callcoach-ai-whhipscribe.vercel.app"
      - key: FRONTEND_URL
        value: "https://callcoachai.sujit.top"
      # Random per-service secret generated by Render (signs OAuth state);
      # never commit a literal value here.
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /data/callcoach.db
      - key: PUBLIC_APP_URL
        value: "https://callcoachai.sujit.top"
      # Connector credentials - set the values in the Render dashboard (sync: false keeps them out of git)
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: HUBSPOT_TOKEN
        sync: false
      # Optional one-click OAuth apps (register once, then Connect is one click for everyone)
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
